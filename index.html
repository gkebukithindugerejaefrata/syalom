<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GKE Bukit Hindu - Gereja Efrata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--text:#16181d;--muted:#6b7280;--line:#eceef2;--accent:#4f46e5}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.hero{text-align:center;padding:64px 20px 36px;max-width:720px;margin:0 auto}
.badge{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:#eef0ff;padding:6px 14px;border-radius:999px}
.hero h1{margin:16px 0 10px;font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0 auto;max-width:480px;color:var(--muted);font-size:1.02rem}
main{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(16,24,40,.1)}
 
/* ===== Efek gambar saat scroll (hanya gambar, teks tidak ikut) ===== */
.img{position:relative;aspect-ratio:16/9;overflow:hidden;background:#eef0f4;
  clip-path:inset(14% 10% 14% 10% round 18px);opacity:0;
  transition:clip-path .9s cubic-bezier(.2,.8,.2,1),opacity .7s ease}
.img.in{clip-path:inset(0 0 0 0 round 0);opacity:1}
.img-inner{position:absolute;left:0;right:0;top:-16%;height:132%;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  will-change:transform,filter;transform:translate3d(0,0,0) scale(1.15)}
.img::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);
  transform:translate3d(var(--shine,-120%),0,0);will-change:transform}
.img::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent 55%,rgba(15,18,40,.22));opacity:var(--vig,.6)}
@media (prefers-reduced-motion:reduce){
  .img{clip-path:none;opacity:1;transition:none}
  .img::after{display:none}
  .img-inner{transform:none!important;filter:none!important}
}
 
.body{padding:16px 18px 20px}
.body h3{margin:0 0 6px;font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.body p{margin:0;color:var(--muted);font-size:.92rem}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header class="hero">
  <span class="badge">Selamat Datang</span>
  <h1>GKE Bukit Hindu</h1>
  <p>Gereja Efrata &mdash; bersekutu, bertumbuh, dan melayani dalam kasih Kristus.</p>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>© GKE Bukit Hindu · Gereja Efrata</footer>
<script>
// Isi image dengan data URI foto bila tersedia; link dengan alamat halaman tujuan.
const items=[
 {name:"Jadwal Natal",desc:"Jadwal Ibadah dan Perayaan Natal di Gedung Gereja Efrata",link:"https://gkebukithindugerejaefrata.github.io/syalom/natal.html",image:"./image/natal.png",g:["#06b6d4","#3b82f6"]},
 {name:"Liturgi Ibadah",desc:"Susunan liturgi ibadah Minggu yang dapat dibuka langsung dari ponsel.",link:"https://gkebukithindugerejaefrata.github.io/liturgi/",image:"./image/liturgi.jpg",g:["#6366f1","#a78bfa"]},
 {name:"Ulang Tahun Jemaat",desc:"Data ulang tahun kelahiran dan pernikahan jemaat.",link:"https://gkebukithindugerejaefrata.github.io/datajemaat/ultah.html",image:"./image/ultah.jpg",g:["#f472b6","#fb923c"]},
 {name:"Jadwal Ibadah",desc:"Jadwal seluruh ibadah dan kegiatan rutin gereja.",link:"https://gkebukithindugerejaefrata.github.io/ibadah/",image:"./image/jadwal.jpg",g:["#10b981","#84cc16"]},
 {name:"Tautan Lain",desc:"Tautan lain mengenai informasi pelayanan via Linktr.ee.",link:"https://linktr.ee/gkebukithindu",image:"./image/link.png",g:["#f59e0b","#ef4444"]},
 {name:"Data Jemaat",desc:"Khusus Pengurus Lingkungan",link:"https://gkebukithindugerejaefrata.github.io/datajemaat/cari.html",image:"./image/cari.jpg",g:["#8b5cf6","#ec4899"]}
];
// Gambar dummy (SVG) - otomatis diganti bila "image" pada item diisi.
function dummy(c){
  const s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs><rect width="640" height="360" fill="url(#a)"/><circle cx="470" cy="110" r="38" fill="#fff" opacity=".55"/><path d="M0 360V250l130-90 120 85 110-70 280 125v60z" fill="#fff" opacity=".35"/><path d="M0 360V300l160-70 150 60 130-45 200 80v35z" fill="#fff" opacity=".55"/></svg>';
  return "data:image/svg+xml;utf8,"+encodeURIComponent(s);
}
const g=document.getElementById("grid");
items.forEach(i=>{
  const a=document.createElement("a");a.className="card";a.href=i.link;
  const img=document.createElement("div");img.className="img";
  const inner=document.createElement("div");inner.className="img-inner";
  inner.style.backgroundImage="url("+(i.image||dummy(i.g))+")";
  img.appendChild(inner);
  const b=document.createElement("div");b.className="body";
  const h=document.createElement("h3");h.textContent=i.name;
  const p=document.createElement("p");p.textContent=i.desc;
  b.append(h,p);a.append(img,b);g.appendChild(a);
});
 
/* ===== Efek scroll pada gambar card =====
   - Reveal: gambar "terbuka" (clip-path) saat pertama masuk layar
   - Parallax: gambar bergeser lebih lambat dari card
   - Zoom: gambar mengecil ke ukuran normal saat berada di tengah layar
   - Fokus: warna lebih hidup di tengah layar, lebih redup di tepi
   - Kilau: cahaya menyapu gambar mengikuti scroll */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const imgs=[...document.querySelectorAll(".img")];
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
  }),{threshold:.15});
  imgs.forEach(el=>io.observe(el));
 
  let ticking=false;
  function update(){
    ticking=false;
    const vh=innerHeight;
    imgs.forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.bottom<-50||r.top>vh+50)return;
      const half=vh/2+r.height/2;
      let t=((r.top+r.height/2)-vh/2)/half;   // -1 (atas) .. 0 (tengah) .. 1 (bawah)
      t=Math.max(-1,Math.min(1,t));
      const a=Math.abs(t),f=1-a;               // f = 1 saat di tengah
      const inner=el.firstChild;
      inner.style.transform="translate3d(0,"+(t*r.height*-0.14).toFixed(1)+"px,0) scale("+(1+0.14*a).toFixed(3)+")";
      inner.style.filter="saturate("+(0.65+0.5*f).toFixed(2)+") brightness("+(0.9+0.12*f).toFixed(2)+")";
      el.style.setProperty("--shine",(t*130).toFixed(1)+"%");
      el.style.setProperty("--vig",(0.25+0.6*a).toFixed(2));
    });
  }
  function req(){if(!ticking){ticking=true;requestAnimationFrame(update);}}
  addEventListener("scroll",req,{passive:true});
  addEventListener("resize",req);
  addEventListener("load",update);
  update();
})();
</script>
</body>
</html>
