        :root{
          --bg:#fdfaf5;
          --bg-soft:#f6efe6;
          --text:#1d1a17;
          --muted:#9a9188;
          --muted-2:#6e6860;
          --line:#ece3d5;
          --line-strong:#ddd0bc;
          --accent:#9f8455;
          --accent-soft:#f3ecde;
          --card:#ffffff;
          --shadow:0 8px 32px rgba(28,24,18,.06),0 1px 2px rgba(28,24,18,.04);
          --shadow-hover:0 24px 48px rgba(28,24,18,.10),0 4px 12px rgba(28,24,18,.06);
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth;color-scheme:light}
        body, .elegan-root{
          margin:0;
          background:var(--bg);
          color:var(--text);
          font-family:"Plus Jakarta Sans","Plus Jakarta Sans Fallback",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
          line-height:1.65;
          -webkit-font-smoothing:antialiased;
          text-rendering:optimizeLegibility;
          min-height:100vh;
        }
        .elegan-root{
          position:relative;
          overflow-x:hidden;
          padding-top:var(--safe-area-inset-top);
          width:100%;
          max-width:100vw;
        }
        .elegan-root::before{
          content:"";
          position:fixed;inset:0;
          pointer-events:none;z-index:-1;
          background:
            radial-gradient(120% 80% at 50% -10%, rgba(159,132,85,.14) 0%, transparent 60%),
            radial-gradient(90% 60% at 90% 10%, rgba(196,181,152,.12) 0%, transparent 50%),
            radial-gradient(70% 50% at 10% 20%, rgba(159,132,85,.08) 0%, transparent 50%);
        }
        /* Header Elegan - persis file asli */
        .hero{
          text-align:center;
          padding:96px 24px 64px;
          max-width:760px;
          margin:0 auto;
          position:relative;
          width:100%;
          box-sizing:border-box;
        }
        .hero::before{
          content:"";
          display:block;
          width:1px;height:48px;
          background:linear-gradient(to bottom, transparent, var(--line-strong));
          margin:0 auto 28px;
        }
        .badge{
          display:inline-flex;align-items:center;gap:10px;
          font-size:.64rem;font-weight:600;letter-spacing:.22em;
          text-transform:uppercase;
          color:var(--accent);
          border:1px solid var(--line);
          background:var(--card);
          padding:7px 16px;
          border-radius:100px;
        }
        .badge::before,.badge::after{
          content:"";width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.7
        }
        .hero h1{
          margin:28px 0 16px;
          font-family:"Cormorant Garamond","Cormorant Garamond Fallback",Georgia,serif;
          font-size:clamp(2.8rem,8vw,4.6rem);
          font-weight:600;
          line-height:.92;
          letter-spacing:-.04em;
          color:var(--text);
          overflow-wrap:break-word;
        }
        .hero h1 em{
          font-weight:400;
          font-style:italic;
          color:var(--accent);
          letter-spacing:-.02em;
        }
        .hero p{
          margin:0 auto;
          max-width:480px;
          color:var(--muted-2);
          font-size:1.08rem;
          font-weight:400;
          line-height:1.7;
          letter-spacing:-.01em;
        }
        .hero-line{
          width:64px;height:1px;
          background:var(--line-strong);
          margin:28px auto 0;
        }
        main{max-width:1160px;margin:0 auto;padding:12px 20px 72px;width:100%;box-sizing:border-box;min-width:0}
        .grid{
          display:grid;
          grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));
          gap:28px 22px;
          width:100%;
          min-width:0;
        }
        /* Card Elegan - persis file asli */
        .card{
          display:flex;flex-direction:column;
          background:var(--card);
          border:1px solid var(--line);
          border-radius:24px;
          overflow:hidden;
          text-decoration:none;
          color:inherit;
          box-shadow:var(--shadow);
          transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s cubic-bezier(.2,.8,.2,1), border-color .4s;
          position:relative;
          isolation:isolate;
          width:100%;
          max-width:100%;
          min-width:0;
        }
        .card::before{
          content:"";
          position:absolute;inset:0;
          border-radius:inherit;
          border:1px solid transparent;
          background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)) border-box;
          mask:linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
          mask-composite:exclude;
          -webkit-mask-composite:xor;
          pointer-events:none;
          opacity:.8;
          z-index:2;
        }
        .card:hover{
          transform:translateY(-8px);
          box-shadow:var(--shadow-hover);
          border-color:var(--line-strong);
        }
        .img{
          position:relative;
          aspect-ratio:4/3.1;
          overflow:hidden;
          background:var(--bg-soft);
          clip-path:inset(8% 6% 8% 6% round 16px);
          opacity:0;
          transition:clip-path 1.1s cubic-bezier(.2,.8,.2,1), opacity .8s ease;
        }
        .img.in{clip-path:inset(0 0 0 0 round 0);opacity:1}
        .img-inner{
          position:absolute;left:0;right:0;top:-18%;height:136%;
          background-size:cover;background-position:center;
